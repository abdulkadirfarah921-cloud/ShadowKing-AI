<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENESIS AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0a0a0f;color:#e5e5e5;display:flex;flex-direction:column;height:100vh}
header{background:#111118;padding:15px 20px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
header .logo{font-size:24px;font-weight:900;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat-box{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
.msg{max-width:75%;padding:14px 18px;border-radius:18px;line-height:1.6}
.user{background:#00aaff;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1a1a22;align-self:flex-start;border:1px solid #2a2a35;border-bottom-left-radius:4px}
.input-area{display:flex;gap:10px;padding:15px;background:#111118;border-top:1px solid #222}
.input-area input{flex:1;background:#1a1a22;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;font-size:16px;outline:none}
.input-area button{background:linear-gradient(90deg,#00ff88,#00aaff);border:none;border-radius:12px;padding:0 25px;color:#000;font-weight:900;cursor:pointer;font-size:16px}
.input-area button:hover{opacity:0.8}
.code-block{background:#000;padding:12px;border-radius:8px;overflow-x:auto;font-family:monospace;font-size:13px;color:#00ff88;margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="logo">⚡ GENESIS AI</div>
</header>

<div class="chat-box" id="chatBox">
  <div class="msg ai">
    مرحبا يا ملك 👑<br>
    انا GENESIS AI. شو بدك نبني اليوم؟
  </div>
</div>

<div class="input-area">
  <input type="text" id="userInput" placeholder="اكتب رسالتك هنا...">
  <button onclick="sendMessage()">ارسال</button>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');

function addMessage(text, sender){
  const msg = document.createElement('div');
  msg.className = 'msg ' + sender;
  msg.innerHTML = text;
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMessage(){
  const text = userInput.value.trim();
  if(!text) return;
  
  addMessage(text, 'user');
  userInput.value = '';
  
  // رد AI وهمي هلق - بعدين نربطه بـ API حقي
  setTimeout(()=>{
    let reply = "فهمت عليك. ";
    if(text.includes("كود") || text.includes("code")){
      reply += "هذا كود لك:<div class='code-block'>function hello(){<br>&nbsp;&nbsp;console.log('Hello GENESIS');<br>}</div>";
    } else if(text.includes("لعبة")){
      reply += "تمام نبني لعبة. تحب FPS ولا 2D؟";
    } else {
      reply += "انا جاهز اساعدك. اطلب اي شي: كود، تصميم، فكرة";
    }
    addMessage(reply, 'ai');
  }, 800);
}

// ارسال بالـ Enter
userInput.addEventListener('keypress', e => {
  if(e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
