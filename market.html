<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHADOWKING FAB STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--card:#141414;--blue:#0078F2;--green:#00FF88;--text:#FFF;--text2:#8A8A8A}
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);overflow-x:hidden}
.header{position:sticky;top:0;z-index:1000;background:rgba(10,10,10,0.95);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.5em;font-weight:900}.logo span{color:var(--green)}
.icons{display:flex;gap:12px;font-size:1.3em;align-items:center}
.icons button, .icons select{background:var(--card);border:1px solid #333;color:var(--text);cursor:pointer;padding:6px 10px;border-radius:8px;font-weight:700;font-size:0.9em}
.badge{position:absolute;top:-6px;left:-6px;background:var(--blue);color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.6em;display:flex;align-items:center;justify-content:center;font-weight:900}
.banner{margin:16px;padding:40px 20px;background:linear-gradient(-45deg,#0078F2,#00FF88);border-radius:16px;text-align:center}
.container{padding:0 16px 100px}
.search-bar{width:100%;padding:14px;background:var(--card);border:1px solid #333;border-radius:12px;color:var(--text);font-size:1em;margin-bottom:16px}
.filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
.filter-btn{background:var(--card);border:1px solid #333;padding:10px 18px;border-radius:30px;color:var(--text);font-weight:800;cursor:pointer;font-size:0.9em;white-space:nowrap}
.filter-btn.active{background:var(--blue);border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid #222;border-radius:14px;overflow:hidden}
.card-img{width:100%;aspect-ratio:16/9;object-fit:cover}
.card-body{padding:12px}.card-title{font-weight:900;font-size:0.95em;margin-bottom:4px;height:38px;overflow:hidden}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{color:var(--green);font-weight:900;font-size:1.2em}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:0.9em}
.btn-green{background:var(--green);color:#000}

/* مودال فول سكرين */
.modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.98);z-index:9999;overflow-y:auto}
.modal-content{background:var(--card);padding:20px;width:100%;min-height:100vh;border-radius:0;text-align:center}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid #333;padding-bottom:12px}
.modal-header h3{font-size:1.3em;font-weight:900}
.close-btn{background:#333;border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.5em;cursor:pointer}

input,textarea,select{width:100%;padding:14px;background:#000;border:1px solid #333;border-radius:10px;color:#fff;margin:8px 0;font-size:1em;text-align:right}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#000;padding:14px 20px;border-radius:12px;font-weight:900;display:none;z-index:3000}
.checkmark{font-size:60px;color:var(--green)}
.action-btn{padding:14px;width:100%;margin:8px 0;border:none;border-radius:10px;cursor:pointer;font-weight:900;font-size:1.1em}

.pay-option{display:flex;align-items:center;gap:12px;padding:14px;background:#000;border:2px solid #333;border-radius:12px;margin:8px 0;cursor:pointer;text-align:right}
.pay-option.selected{border-color:var(--green);background:rgba(0,255,136,0.05)}
.pay-icon{font-size:1.8em;min-width:40px}
.currency-select{width:100%;padding:14px;background:#000;border:2px solid var(--blue);border-radius:12px;color:#fff;font-size:1em;font-weight:900;margin:16px 0;max-height:300px}
.total-box{background:#000;border:1px solid #333;border-radius:12px;padding:16px;margin:16px 0}
.rate-info{color:var(--text2);font-size:0.8em;margin-top:8px}
</style>
</head>
<body>

<div class="header">
  <div class="icons">
    <select id="langSelect"><option>🇸🇦 العربية</option></select>
    <button onclick="checkPayment()">+ نشر</button>
    <button style="position:relative" onclick="alert('السلة')">🛒<span class="badge" id="cartCount">0</span></button>
  </div>
  <div class="logo">SHADOWKING <span>FAB STORE</span></div>
</div>

<div class="banner"><h1>🔥 عرض الاسبوع -50% 🔥</h1></div>

<div class="container">
  <input id="search" class="search-bar" placeholder="🔍 ابحث عن LUT, انتقال, AI...">
  <div id="grid" class="grid"></div>
</div>

<!-- مودال الدفع فول سكرين -->
<div id="paymentModal" class="modal"><div class="modal-content">
  <div class="modal-header">
    <h3>💳 اتمام الدفع</h3>
    <button class="close-btn" onclick="closeModal('paymentModal')">×</button>
  </div>
  
  <h4 style="text-align:right;margin:12px 0">اختر طريقة الدفع</h4>
  <div id="payMethods"></div>

  <h4 style="text-align:right;margin:16px 0 8px 0">اختر العملة</h4>
  <select class="currency-select" id="currencySelect" onchange="convertCurrency()" size="8"></select>

  <div class="total-box">
    <div style="display:flex;justify-content:space-between"><span>رسوم النشر</span><span id="baseFee">جاري التحميل...</span></div>
    <hr style="border-color:#333;margin:8px 0">
    <div style="display:flex;justify-content:space-between;font-weight:900;font-size:1.2em"><span>الاجمالي</span><span style="color:var(--green)" id="totalFee">جاري التحميل...</span></div>
    <div class="rate-info" id="rateInfo">جاري جلب اسعار الصرف...</div>
  </div>

  <button class="action-btn btn-green" onclick="payNow()">🔒 اكمال الدفع الامن</button>
  <div style="color:var(--green);font-size:0.85em">🛡️ مشفر بواسطة Paddle</div>
</div></div>

<!-- مودال النجاح -->
<div id="successModal" class="modal"><div class="modal-content">
  <div class="modal-header"><h3>نشر منتج</h3><button class="close-btn" onclick="closeModal('successModal')">×</button></div>
  <div class="checkmark">✓</div><h3>تم الدفع بنجاح</h3>
  <input id="n" placeholder="اسم المنتج"><input id="author" placeholder="اسم الاستوديو">
  <textarea id="d" rows="3" placeholder="وصف المنتج"></textarea><input id="i" placeholder="رابط صورة">
  <button class="action-btn btn-green" onclick="alert('تم الرفع')">رفع المنتج</button>
</div></div>

<div id="toast" class="toast"></div>

<script>
const BASE_PRICE = 5;
const SERVER = "https://protection-cybersecurity.onrender.com";
let RATES = {USD: 1};
let SELECTED_PAY = 'card';

// 15 طريقة دفع عالمية
const PAY_METHODS = [
  {id:'card', name:'بطاقة ائتمان / مدى', desc:'Visa, Mastercard, Amex, Mada', icon:'💳'},
  {id:'paypal', name:'PayPal', desc:'الدفع بحساب بايبال', icon:'🅿️'},
  {id:'apple', name:'Apple Pay', desc:'دفع سريع للايفون', icon:'🍎'},
  {id:'google', name:'Google Pay', desc:'دفع سريع للاندرويد', icon:'🟢'},
  {id:'stripe', name:'Stripe', desc:'بطاقات دولية', icon:'💰'},
  {id:'paddle', name:'Paddle', desc:'للشركات والافراد', icon:'🏢'},
  {id:'crypto', name:'العملات الرقمية', desc:'USDT, BTC, ETH', icon:'₿'},
  {id:'bank', name:'تحويل بنكي', desc:'SWIFT / IBAN', icon:'🏦'},
  {id:'stc', name:'STC Pay', desc='محفظة STC', icon:'📱'},
  {id:'tabby', name:'Tabby', desc='ادفع لاحقا', icon:'📅'},
  {id:'tamara', name:'Tamara', desc='تقسيط 4 دفعات', icon:'🛍️'},
  {id:'cashu', name:'CashU', desc='محفظة كاش يو', icon:'💵'},
  {id:'onecard', name:'OneCard', desc='بطاقة مدفوعة', icon:'🎫'},
  {id:'amazon', name:'Amazon Pay', desc='ادفع بامازون', icon:'📦'},
  {id:'western', name:'Western Union', desc='تحويل فوري', icon:'🌍'}
];

function renderPayMethods(){
  payMethods.innerHTML = PAY_METHODS.map((m,i)=>`
    <div class="pay-option ${i==0?'selected':''}" data-method="${m.id}" onclick="selectPay(this)">
      <div class="pay-icon">${m.icon}</div>
      <div><b>${m.name}</b><div style="color:var(--text2);font-size:0.85em">${m.desc}</div></div>
    </div>
  `).join('');
}

// جلب كل العملات + الاسعار
async function fetchRates(){
  try{
    let res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    let data = await res.json();
    RATES = data.rates;
    
    // نعبي كل العملات في select
    const CURRENCIES = {
      USD:'🇺🇸 دولار امريكي', EUR:'🇪🇺 يورو', GBP:'🇬🇧 جنيه استرليني', TRY:'🇹🇷 ليرة تركية',
      SAR:'🇸🇦 ريال سعودي', AED:'🇦🇪 درهم اماراتي', EGP:'🇪🇬 جنيه مصري', QAR:'🇶🇦 ريال قطري',
      KWD:'🇰🇼 دينار كويتي', BHD:'🇧🇭 دينار بحريني', OMR:'🇴🇲 ريال عماني', JOD:'🇯🇴 دينار اردني',
      MAD:'🇲🇦 درهم مغربي', TND:'🇹🇳 دينار تونسي', DZD:'🇩🇿 دينار جزائري', IQD:'🇮🇶 دينار عراقي',
      LBP:'🇱🇧 ليرة لبنانية', SYR:'🇸🇾 ليرة سورية', YER:'🇾🇪 ريال يمني', PKR:'🇵🇰 روبية باكستانية',
      INR:'🇮🇳 روبية هندية', CNY:'🇨🇳 يوان صيني', JPY:'🇯🇵 ين ياباني', KRW:'🇰🇷 وون كوري'
    };
    
    currencySelect.innerHTML = Object.keys(RATES).slice(0,160).map(code=>{
      let name = CURRENCIES[code] || code;
      let symbol = code;
      return `<option value="${code}" data-symbol="${symbol}">${name} - ${code}</option>`
    }).join('');
    
    convertCurrency();
  }catch(e){ rateInfo.innerText = "فشل الاتصال بالانترنت" }
}

function convertCurrency(){
  let select = document.getElementById('currencySelect');
  if(!select || !RATES) return;
  let currency = select.value;
  let rate = RATES[currency] || 1;
  let converted = (BASE_PRICE * rate).toFixed(2);
  baseFee.innerText = converted + ' + currency;
  totalFee.innerText = converted + ' + currency;
  rateInfo.innerText = `1 USD = ${rate.toFixed(4)} ${currency} - محدث الان`;
}

function selectPay(el){
  document.querySelectorAll('.pay-option').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  SELECTED_PAY = el.dataset.method;
}

function closeModal(id){document.getElementById(id).style.display='none';}
function checkPayment(){ paymentModal.style.display='block'; renderPayMethods(); fetchRates(); }
function payNow(){
  let currency = currencySelect.value;
  let amount = (BASE_PRICE * (RATES[currency] || 1)).toFixed(2);
  window.location.href = `${SERVER}/pay/Test?amount=${amount}&currency=${currency}&method=${SELECTED_PAY}`;
}

window.onload = ()=>{ grid.innerHTML = '<div style="text-align:center;color:var(--text2)">السوق فاضي - انشر اول منتج</div>' }
</script>
</body>
</html>
