<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOWKING FAB STORE - FREE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#12121a;--matrix:#00ff41;--text:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:50px}
#fab-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.1}
header{position:sticky;top:0;background:rgba(10,10,15,0.9);backdrop-filter:blur(10px);padding:12px 5%;display:flex;justify-content:space-between;align-items:center;z-index:1000;border-bottom:1px solid #222}
.logo{font-size:22px;font-weight:900;color:var(--matrix);text-shadow:0 0 10px var(--matrix)}
.container{padding:20px 5%}
.search-box{width:100%;padding:12px;background:var(--card);border:1px solid #333;border-radius:10px;color:var(--text);margin-bottom:20px;font-size:16px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border:1px solid #222;border-radius:12px;overflow:hidden;transition:0.3s}
.card:hover{transform:translateY(-5px);border-color:var(--matrix);box-shadow:0 0 20px var(--matrix)30}
.card-img{width:100%;height:200px;background:#000;display:flex;align-items:center;justify-content:center;color:#555}
.card-body{padding:15px}
.card-title{font-size:18px;font-weight:800;margin-bottom:8px}
.card-price{font-size:20px;font-weight:900;color:var(--matrix);margin-bottom:12px;text-shadow:0 0 5px var(--matrix)}
.btn-buy{width:100%;padding:12px;background:linear-gradient(90deg,var(--matrix),#fff);color:#000;border:none;border-radius:8px;font-weight:900;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="fab-bg"></canvas>

<header>
  <div class="logo">SHADOWKING <span>FAB STORE</span></div>
  <div style="color:var(--matrix)">مجاناً 100%</div>
</header>

<div class="container">
  <input type="text" id="search" class="search-box" placeholder="ابحث في المتجر...">
  <div class="product-grid" id="productGrid">جاري التحميل...</div>
</div>

<script>
// خلفية ماتركس
const matrix = document.getElementById('fab-bg');
const mctx = matrix.getContext('2d');
matrix.width = window.innerWidth; matrix.height = window.innerHeight;
let mchars = "01FAB".split("");let mfont = 14;let mcols = matrix.width/mfont;let mdrops = [];
for(let x=0;x<mcols;x++) mdrops[x]=1;
function mdraw(){
  mctx.fillStyle="rgba(0,0,0,0.05)";mctx.fillRect(0,0,matrix.width,matrix.height);
  mctx.fillStyle="#00ff41";mctx.font=mfont+"px monospace";
  for(let i=0;i<mdrops.length;i++){
    mctx.fillText(mchars[Math.floor(Math.random()*mchars.length)],i*mfont,mdrops[i]*mfont);
    if(mdrops[i]*mfont>matrix.height&&Math.random()>0.975) mdrops[i]=0;mdrops[i]++;
  }
}
setInterval(mdraw,33);

// تحميل المنتجات من السيرفر
async function loadProducts(){
  const res = await fetch('/api/products');
  const products = await res.json();
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  products.forEach(p=>{
    grid.innerHTML += `
    <div class="card">
      <div class="card-img">🖼️ ${p.title}</div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-price">مجاناً FREE</div>
        <button class="btn-buy" onclick="download('${p.file}')">⬇️ تحميل مباشر</button>
      </div>
    </div>`;
  });
}

function download(file){
  window.location.href = `/api/download/${file}`;
}

loadProducts();
</script>
</body>
</html>
