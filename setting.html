<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاعدادات - TITAN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:rgba(0,20,0,0.8);--neon:#00ff41;--text:#e0ffe0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#000;color:var(--text);padding:20px}
#matrix-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.2}
.container{max-width:800px;margin:0 auto;background:var(--card);border:2px solid var(--neon);border-radius:20px;padding:30px;backdrop-filter:blur(20px)}
h1{color:var(--neon);margin-bottom:20px;text-shadow:0 0 10px var(--neon)}
.setting-group{margin-bottom:25px;padding:15px;border:1px solid var(--neon)30;border-radius:12px}
.setting-group h3{color:var(--neon);margin-bottom:10px}
.switch{display:flex;align-items:center;gap:10px;margin:10px 0}
</style>
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div class="container">
  <h1>⚙️ اعدادات TITAN MATRIX</h1>

  <div class="setting-group">
    <h3>🎨 المظهر</h3>
    <div class="switch"><input type="checkbox" id="darkMode" checked><label>الوضع المظلم</label></div>
    <div class="switch"><input type="checkbox" id="matrixBg" checked><label>تفعيل خلفية الماتركس</label></div>
  </div>

  <div class="setting-group">
    <h3>🔒 الامان</h3>
    <div class="switch"><input type="checkbox" id="twoFactor"><label>المصادقة الثنائية</label></div>
    <div class="switch"><input type="checkbox" id="loginRequired"><label>اجبار تسجيل الدخول للتحميل</label></div>
  </div>

  <div class="setting-group">
    <h3>📢 الاشعارات</h3>
    <div class="switch"><input type="checkbox" id="newProductNotif" checked><label>اشعار عند منتج جديد</label></div>
    <div class="switch"><input type="checkbox" id="emailNotif"><label>اشعارات بالايميل</label></div>
  </div>

  <div class="setting-group">
    <h3>🚀 الاداء</h3>
    <div class="switch"><input type="checkbox" id="autoSave" checked><label>الحفظ التلقائي</label></div>
    <div class="switch"><input type="checkbox" id="highQuality"><label>جودة عالية للمعاينة</label></div>
  </div>

  <button onclick="alert('تم حفظ الاعدادات')" style="width:100%;padding:15px;background:linear-gradient(90deg,var(--neon),#fff);border:none;border-radius:12px;color:#000;font-weight:900;font-size:18px">💾 حفظ كل الاعدادات</button>
</div>
</body>
</html>
