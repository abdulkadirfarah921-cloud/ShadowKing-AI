<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><title>مولد الكود TITAN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
body{background:#050509;color:#e0e0ff;font-family:'Cairo';padding:20px}
h1{background:linear-gradient(90deg,#00f5ff,#ff00e5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.back{color:#fff;background:#1a1a2a;padding:10px 15px;border-radius:10px;text-decoration:none;float:right}
textarea{width:100%;height:120px;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:12px;color:#fff;padding:12px;font-size:16px}
.btn{background:linear-gradient(90deg,#00f5ff,#ff00e5);border:none;padding:14px;border-radius:12px;color:#000;font-weight:900;width:100%;margin-top:15px;cursor:pointer}
#output{background:#000;border:1px solid #00ff88;border-radius:12px;padding:15px;margin-top:15px;white-space:pre-wrap;font-family:monospace;color:#00ff88}
</style></head><body>
<a href="index.html" class="back">← الرجوع</a><h1><> مولد الكود</h1>
<textarea id="prompt" placeholder="اكتب: سوي لي موقع تسجيل دخول ب HTML CSS"></textarea>
<button class="btn" onclick="generateCode()">⚡ توليد الكود</button>
<div id="output">الكود هيظهر هنا</div>

<script>
async function generateCode(){
  let prompt = "انت مبرمج محترف. اكتب كود كامل: " + document.getElementById('prompt').value;
  document.getElementById('output').innerText = "TITAN يفكر...";
  
  // نستخدم Pollinations Text API
  let res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt));
  let text = await res.text();
  document.getElementById('output').innerText = text;
}
</script>
</body></html>
