<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><title>مصنع المواقع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
body{background:#050509;color:#e0e0ff;font-family:'Cairo';padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{background:linear-gradient(90deg,#00f5ff,#ff00e5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.back{color:#fff;background:#1a1a2a;padding:10px 15px;border-radius:10px;text-decoration:none}
input{width:100%;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:12px;color:#fff;padding:12px;font-size:16px;margin-bottom:10px}
.btn{background:linear-gradient(90deg,#00f5ff,#ff00e5);border:none;padding:14px;border-radius:12px;color:#000;font-weight:900;width:100%;cursor:pointer}
</style></head><body>
<header><h1>🌐 مصنع المواقع</h1><a href="index.html" class="back">← الرجوع</a></header>
<input id="name" placeholder="اسم الموقع: متجر احذية">
<input id="type" placeholder="نوعه: متجر / مدونة / بورتفوليو">
<button class="btn" onclick="alert('جاري انشاء الموقع: '+document.getElementById('name').value)">⚡ بناء الموقع</button>
</body></html>
