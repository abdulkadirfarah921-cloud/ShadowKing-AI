<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>TITAN CODE FORGE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo'}
body{
  background:#000;
  color:#00ff00;
  overflow-x:hidden;
}

/* مطر الكود */
.code-rain{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:-1;
  opacity:0.2;
}

/* هيدر المصنع */
.forge-header{
  background:linear-gradient(180deg,#001100 0%, #000 100%);
  border-bottom:4px solid #00ff00;
  padding:30px;
  text-align:center;
  box-shadow:0 0 60px #00ff00aa;
  position:relative;
}
.forge-header::before{
  content:'';
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:repeating-linear-gradient(90deg,#00ff00 0px,#00ff00 2px,transparent 2px,transparent 4px);
  opacity:0.1;
  animation:scan 4s linear infinite;
}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

h1{
  font-size:44px;
  font-weight:900;
  color:#00ff00;
  text-shadow:0 0 20px #00ff00, 0 0 40px #FFD700;
  animation:forge 2s infinite;
}
@keyframes forge{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* الشبكة */
.forge-grid{
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  gap:25px;
  padding:30px;
  max-width:1800px;
  margin:0 auto;
}
.panel{
  background:linear-gradient(145deg,#001100,#000);
  border:3px solid #00ff00;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 30px #00ff0033, inset 0 0 30px #000;
  position:relative;
}
.panel::after{
  content:'';
  position:absolute;
  bottom:0;right:0;
  width:50px;height:50px;
  border-right:3px solid #FFD700;
  border-bottom:3px solid #FFD700;
  border-radius:0 0 20px 0;
}

/* الروبوت */
.robot{
  position:fixed;
  bottom:0;
  right:-250px;
  width:250px;
  height:350px;
  background:linear-gradient(45deg,#333,#666);
  border-radius:20px 0 0 0;
  border:3px solid #00ff00;
  animation:work 6s infinite;
  z-index:10;
}
@keyframes work{0%,100%{right:-250px}50%{right:0}}
.robot::before{
  content:'🤖';
  position:absolute;
  top:50px;left:50%;
  transform:translateX(-50%);
  font-size:60px;
}

/* شاشة المعاينة */
.preview-forge{
  background:#000;
  border:4px solid #FFD700;
  border-radius:20px;
  min-height:500px;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 40px #FFD70055, inset 0 0 50px #00ff0022;
}
.preview-forge::before{
  content:'SCANNING...';
  position:absolute;
  top:10px;left:10px;
  color:#00ff00;
  font-size:12px;
  font-family:monospace;
  animation:blink 1s infinite;
}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

.btn-forge{
  background:linear-gradient(90deg,#00ff00,#FFD700);
  color:#000;
  padding:18px;
  border:none;
  border-radius:15px;
  font-size:18px;
  font-weight:900;
  width:100%;
  margin:12px 0;
  cursor:pointer;
  box-shadow:0 0 20px #00ff0055;
  transition:0.3s;
}
.btn-forge:hover{
  transform:scale(1.05);
  box-shadow:0 0 40px #FFD700;
}

textarea{
  width:100%;
  padding:14px;
  background:#000;
  border:2px solid #00ff00;
  border-radius:12px;
  color:#00ff00;
  margin:10px 0;
  font-size:16px;
  box-shadow:inset 0 0 15px #00ff0022;
}
.code-box{
  background:#000;
  border:2px solid #00ff00;
  border-radius:15px;
  min-height:400px;
  padding:15px;
  font-family:monospace;
  font-size:12px;
  color:#00ff00;
  overflow:auto;
  text-align:left;
  direction:ltr;
}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000ee;z-index:999;justify-content:center;align-items:center}
.modal-content{background:linear-gradient(145deg,#001100,#000);border:3px solid #00ff00;border-radius:20px;padding:30px;width:90%;max-width:500px}
</style></head>
<body>

<canvas class="code-rain" id="matrix"></canvas>
<div class="robot"></div>

<div class="forge-header">
  <h1>⚒️ TITAN CODE FORGE ⚒️</h1>
  <p>2500 روبوت مبرمج + مصنع كود الماتركس</p>
</div>

<div class="forge-grid">
  <div class="panel">
    <h3 style="color:#00ff00;text-align:center">🧠 وحدة التحكم</h3>
    <textarea id="appIdea" rows="4" placeholder="اكتب فكرة التطبيق: تطبيق توصيل شيطاني"></textarea>
    <button class="btn-forge" onclick="startForge()">⚡ شغل خط الانتاج</button>
    <div id="forgeLog" style="margin-top:15px;font-size:12px;color:#00ff00;font-family:monospace"></div>
  </div>

  <div class="panel">
    <h3 style="color:#FFD700;text-align:center">👁️ خط التجميع</h3>
    <div class="preview-forge" id="appPreview"></div>
    <button class="btn-forge" onclick="downloadZIP()">📦 تحميل ZIP</button>
    <button class="btn-forge" onclick="showDownloadModal()">📲 تحميل التطبيق</button>
  </div>

  <div class="panel">
    <h3 style="color:#00ff00;text-align:center">💻 كود المصنع</h3>
    <div class="code-box" id="codeBox">// بانتظار الامر...</div>
    <h3 style="color:#FFD700;text-align:center;margin-top:20px">🏭 300 صلاحية</h3>
    <div id="permissions" style="font-size:13px;color:#00ff00">
      <div>⏳ المصنع متوقف</div>
    </div>
  </div>
</div>

<div class="modal" id="downloadModal">
  <div class="modal-content">
    <h3 style="text-align:center;color:#00ff00;margin-bottom:20px">اختر صيغة التصدير</h3>
    <button class="btn-forge" onclick="downloadApp('apk')">📱 Android APK</button>
    <button class="btn-forge" onclick="downloadApp('exe')">💻 Windows EXE</button>
    <button class="btn-forge" onclick="downloadApp('ipa')">🍎 iOS IPA</button>
    <button class="btn-forge" onclick="downloadApp('pwa')">🌐 PWA</button>
    <button class="btn-forge" style="background:#333;color:#fff" onclick="closeModal()">الغاء</button>
  </div>
</div>

<script>
// مطر الكود
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const chars = "01APPFORGETITAN";
const fontSize = 14;
const columns = canvas.width/fontSize;
const drops = [];
for(let x = 0; x < columns; x++) drops[x] = 1;
function draw(){
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0F0';
  ctx.font = fontSize + 'px monospace';
  for(let i = 0; i < drops.length; i++){
    let text = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(draw, 35);

let projectFiles = {};
function startForge(){
  let idea = document.getElementById('appIdea').value;
  if(!idea) return alert('اكتب فكرة التطبيق');

  let log = document.getElementById('forgeLog');
  log.innerHTML = '';
  let steps = [
    '> تشغيل 2500 روبوت',
    '> استلام: '+idea,
    '> تصنيع واجهة TITAN',
    '> حقن 2000 سطر كود',
    '> تجميع قاعدة البيانات',
    '> ✅ التطبيق جاهز للتصدير'
  ];
  steps.forEach((s,i)=>setTimeout(()=>log.innerHTML += s+'<br>', i*600));

  setTimeout(()=>{
    document.getElementById('appPreview').innerHTML = `
      <div style="padding:20px">
        <h2 style="color:#FFD700;text-align:center">${idea}</h2>
        <div style="background:#001100;padding:20px;border-radius:15px;margin:20px 0;border:2px solid #00ff00">
          <input placeholder="الايميل" style="width:100%;padding:12px;margin:10px 0;background:#000;border:2px solid #00ff00;border-radius:10px;color:#00ff00">
          <button style="width:100%;padding:14px;background:linear-gradient(90deg,#00ff00,#FFD700);border:none;border-radius:10px;color:#000;font-weight:900">دخول</button>
        </div>
      </div>
    `;
    projectFiles = {
      'index.html': '<!DOCTYPE html><html><head><title>TITAN</title></head><body><h1>TITAN APP</h1></body></html>',
      'style.css': 'body{background:#000;color:#00ff00}',
      'app.js': 'console.log("TITAN FORGE")',
      'database.json': '{"users":300}'
    };
    document.getElementById('codeBox').innerText = projectFiles['index.html'];
    document.getElementById('permissions').innerHTML = `
      <div>✅ Admin: 50</div>
      <div>✅ Editor: 100</div>
      <div>✅ User: 150</div>
    `;
  }, 4000);
}

async function downloadZIP(){
  const zip = new JSZip();
  for(let f in projectFiles) zip.file(f, projectFiles[f]);
  const blob = await zip.generateAsync({type:"blob"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'titan-app.zip';
  a.click();
}

function showDownloadModal(){document.getElementById('downloadModal').style.display = 'flex';}
function closeModal(){document.getElementById('downloadModal').style.display = 'none';}
function downloadApp(type){alert('📲 تجهيز '+type.toUpperCase()); closeModal();}
</script>
</body></html>
