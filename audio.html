<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOWKING TITAN VOID</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Arial}
body{
  background:#000;
  color:#FFD700;
  text-align:center;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* خلفية ماتركس + نار */
.matrix-rain{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:-2;
  opacity:0.2;
}
.fire-bg{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:
    radial-gradient(circle at 20% 30%, #ff000033 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, #ff000033 0%, transparent 50%);
  animation:fire 4s infinite alternate;
  z-index:-1;
}
@keyframes fire{0%{opacity:0.2} 100%{opacity:0.6}}

.container{
  max-width:1400px;
  margin:40px auto;
  padding:20px;
  position:relative;
  z-index:1;
}

h1{
  font-size:48px;
  font-weight:900;
  color:#FFD700;
  text-shadow:0 0 20px #FFD700, 0 0 40px #ff0000, 0 0 60px #00ff00;
  animation:pulse 2s infinite;
  margin-bottom:10px;
}
@keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.05)}}
.subtitle{color:#00ff00;font-size:18px;margin-bottom:40px;text-shadow:0 0 10px #00ff00}

/* شبكة الاستوديوهات */
.studios-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
  margin-bottom:40px;
}
.studio-card{
  background:linear-gradient(145deg, #0a0a0a, #1a0a0a);
  border:3px solid #FFD700;
  border-radius:25px;
  padding:30px 20px;
  cursor:pointer;
  transition:0.4s;
  position:relative;
  overflow:hidden;
}
.studio-card::before{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:3px;
  background:linear-gradient(90deg,transparent,#00ff00,#ff0000,transparent);
  animation:scan 3s infinite;
}
@keyframes scan{0%{left:-100%}100%{left:100%}}
.studio-card:hover{
  transform:translateY(-10px) scale(1.03);
  border-color:#ff0000;
  box-shadow:0 0 40px #FFD70088, 0 0 60px #ff000055;
}
.studio-icon{font-size:50px;margin-bottom:15px}
.studio-title{font-size:22px;font-weight:900;margin-bottom:10px;color:#FFD700}
.studio-desc{font-size:14px;color:#aaa}

/* بوكس توليد الصوت */
.voice-box{
  background:linear-gradient(145deg, #110011, #000);
  border:3px solid #aa00ff;
  border-radius:25px;
  padding:30px;
  margin-bottom:30px;
  box-shadow:0 0 30px #aa00ff55;
}
.label{color:#aa00ff;font-weight:900;margin-bottom:15px;font-size:18px;text-shadow:0 0 10px #aa00ff}
input{
  width:100%;
  padding:18px;
  background:#000;
  border:2px solid #aa00ff;
  border-radius:15px;
  color:#aa00ff;
  font-size:16px;
  text-align:right;
  margin-bottom:20px;
  outline:none;
}
input:focus{border-color:#ff00ff;box-shadow:0 0 20px #ff00ff66}

.btn{
  width:100%;
  padding:18px;
  background:linear-gradient(90deg, #aa00ff, #ff00ff);
  border:none;
  border-radius:15px;
  color:#000;
  font-weight:900;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 20px #aa00ff55;
}
.btn:hover{transform:scale(1.05);box-shadow:0 0 40px #ff00ff}

.divider{
  color:#ff0000;
  margin:30px 0;
  font-weight:900;
  font-size:16px;
  text-shadow:0 0 10px #ff0000;
}
.divider::before,.divider::after{content:'⚡';margin:0 15px}

</style>
</head>
<body>

<canvas class="matrix-rain" id="matrix"></canvas>
<div class="fire-bg"></div>

<div class="container">
<h1>👑 SHADOWKING TITAN VOID 👑</h1>
<p class="subtitle">2500 AI | 4 استوديوهات | 8000 ميزة</p>

<!-- 4 الاستوديوهات -->
<div class="studios-grid">
  <div class="studio-card" onclick="location.href='game.html'">
    <div class="studio-icon">⚔️</div>
    <div class="studio-title">VOID ARENA</div>
    <div class="studio-desc">مصنع العاب + سيرفرات + 2000 ميزة</div>
  </div>

  <div class="studio-card" onclick="location.href='app.html'">
    <div class="studio-icon">⚒️</div>
    <div class="studio-title">CODE FORGE</div>
    <div class="studio-desc">مصنع تطبيقات + 300 صلاحية</div>
  </div>

  <div class="studio-card" onclick="location.href='code.html'">
    <div class="studio-icon">💻</div>
    <div class="studio-title">CODE MATRIX</div>
    <div class="studio-desc">غرفة هاكرز + كود + تيرمنال</div>
  </div>

  <div class="studio-card" onclick="location.href='audio.html'">
    <div class="studio-icon">🎛️</div>
    <div class="studio-title">AUDIO VOID</div>
    <div class="studio-desc">استوديو صوت + ميكسر + AI</div>
  </div>
</div>

<div class="divider">توليد سريع بالذكاء الاصطناعي</div>

<!-- توليد الصوت -->
<div class="voice-box">
<div class="label">🔊 صنع صوت شيطاني بالذكاء الاصطناعي</div>
<input type="text" id="aiPrompt" placeholder="اكتب: صوت ملكي غاضب / صوت شيطان / صوت روبوت">
<button class="btn" onclick="makeAI()">⚡ توليد ونقل للاستوديو</button>
</div>

</div>

<script>
// مطر الماتركس
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const chars = "01SHADOWKINGTITAN";
const fontSize = 14;
const columns = canvas.width/fontSize;
const drops = [];
for(let x = 0; x < columns; x++) drops[x] = 1;
function draw(){
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0F0';
  ctx.font = fontSize + 'px monospace';
  for(let i = 0; i < drops.length; i++){
    let text = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(draw, 35);

function makeAI(){
  const prompt = document.getElementById('aiPrompt').value;
  if(prompt.trim() == ''){alert('اكتب وصف الصوت اول'); return;}

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 5, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let freq = 180;
  if(prompt.includes('غاضب')) freq = 120;
  if(prompt.includes('ملكي')) freq = 100;
  if(prompt.includes('طفل')) freq = 600;
  if(prompt.includes('شيطان')) freq = 80;
  if(prompt.includes('روبوت')) freq = 200;
  for(let i=0; i<buffer.length; i++){
    data[i] = Math.sin(2*Math.PI*freq*i/ctx.sampleRate) * 0.3 * Math.sin(Math.PI*i/buffer.length);
  }

  const wav = toWav(buffer);
  const url = URL.createObjectURL(new Blob([wav], {type:'audio/wav'}));

  localStorage.setItem('audioData', url);
  localStorage.setItem('audioName', prompt);

  alert('✅ تم توليد الصوت! جاري نقلك لـ AUDIO VOID');
  window.location.href = 'audio.html';
}

function toWav(buffer){
  const len = buffer.length * 2 + 44;
  const buf = new ArrayBuffer(len);
  const v = new DataView(buf);
  let p = 0;
  const s16 = d => {v.setInt16(p,d,true);p+=2};
  const s32 = d => {v.setInt32(p,d,true);p+=4};
  s32(0x46464952);s32(len-8);s32(0x45564157);s32(0x20746d66);s32(16);s16(1);s16(1);
  s32(buffer.sampleRate);s32(buffer.sampleRate*2);s16(2);s16(16);s32(0x61746164);s32(len-p-4);
  const d = buffer.getChannelData(0);
  for(let i=0;i<d.length;i++){let s=Math.max(-1,Math.min(1,d[i]));v.setInt16(p,s<0?s*0x8000:s*0x7FFF,true);p+=2;}
  return v;
}
</script>
</body>
</html>
