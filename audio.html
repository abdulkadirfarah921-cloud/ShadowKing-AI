<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOWKING TITAN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Arial}
body{
  background:radial-gradient(circle at 50% 50%, #1a0000 0%, #000 100%);
  color:#FFD700;
  text-align:center;
  padding:40px;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:
    radial-gradient(circle at 20% 30%, #ff000022 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, #ff000022 0%, transparent 50%);
  animation:fire 8s infinite alternate;
  pointer-events:none;
}
@keyframes fire{
  0%{opacity:0.3} 100%{opacity:0.7}
}

.container{
  max-width:500px;
  margin:0 auto;
  background:linear-gradient(145deg, #0a0a0a, #1a0a0a);
  border:3px solid #FFD700;
  border-radius:30px;
  padding:35px;
  box-shadow:0 0 40px #FFD70055, inset 0 0 20px #000;
  position:relative;
  z-index:1;
}
.container::before{
  content:'';
  position:absolute;
  top:-3px; left:-3px; right:-3px; bottom:-3px;
  background:linear-gradient(45deg, #FFD700, #ff0000, #FFD700);
  border-radius:30px;
  z-index:-1;
  filter:blur(10px);
  animation:borderGlow 3s linear infinite;
}
@keyframes borderGlow{
 0%,100%{opacity:0.5} 50%{opacity:1}
}

h1{
  margin-bottom:25px;
  font-size:32px;
  font-weight:900;
  color:#FFD700;
  text-shadow:0 0 20px #FFD700, 0 0 40px #ff0000;
  animation:pulse 2s infinite;
}
@keyframes pulse{
 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)}
}

.box{
  background:linear-gradient(145deg, #111, #1a1a1a);
  border-radius:20px;
  padding:25px;
  margin-bottom:25px;
  border:2px solid #333;
  box-shadow:inset 0 0 15px #000;
  transition:0.3s;
}
.box:hover{
  border-color:#FFD700;
  box-shadow:0 0 20px #FFD70033, inset 0 0 15px #000;
  transform:translateY(-3px);
}

.label{
  color:#FFD700;
  font-weight:900;
  margin-bottom:15px;
  font-size:17px;
  text-shadow:0 0 10px #FFD700;
}

input{
  width:100%;
  padding:16px;
  background:#000;
  border:2px solid #444;
  border-radius:15px;
  color:#FFD700;
  font-size:16px;
  text-align:right;
  margin-bottom:18px;
  outline:none;
  transition:0.3s;
}
input:focus{
  border-color:#FFD700;
  box-shadow:0 0 20px #FFD70066;
  background:#0a0a0a;
}

.btn{
  width:100%;
  padding:18px;
  background:linear-gradient(90deg, #FFD700, #ffaa00);
  border:none;
  border-radius:15px;
  color:#000;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
  margin-bottom:15px;
  transition:0.3s;
  box-shadow:0 4px 15px #FFD70044;
}
.btn:hover{
  background:linear-gradient(90deg, #FFD700, #ff0000);
  transform:scale(1.05);
  box-shadow:0 0 25px #FFD700;
}

.btn-outline{
  background:transparent;
  color:#FFD700;
  border:3px solid #FFD700;
  box-shadow:none;
}
.btn-outline:hover{
  background:#FFD700;
  color:#000;
  box-shadow:0 0 25px #FFD700;
}

.btn-video{
  background:linear-gradient(90deg,#ff0000,#ff6600);
  color:#fff;
  border:none;
}
.btn-video:hover{
  background:linear-gradient(90deg,#ff6600,#ff0000);
  box-shadow:0 0 25px #ff0000;
}

.divider{
  color:#ff0000;
  margin:20px 0;
  font-weight:900;
  font-size:15px;
  text-shadow:0 0 10px #ff0000;
  position:relative;
}
.divider::before,.divider::after{
  content:'⚡';
  margin:0 10px;
}

.back{
  background:#111;
  color:#aaa;
  border:2px solid #333;
  margin-top:15px;
  box-shadow:none;
}
.back:hover{
  background:#222;
  border-color:#FFD700;
  color:#FFD700;
  box-shadow:none;
  transform:scale(1.02);
}
</style>
</head>
<body>

<div class="container">
<h1>👑 SHADOWKING TITAN 👑</h1>

<div class="box">
<div class="label">صنع صوت جديد بالذكاء الاصطناعي الشيطاني</div>
<input type="text" id="aiPrompt" placeholder="اكتب وصف الصوت: مثال صوت ملكي غاضب">
<button class="btn" onclick="makeAI()">⚡ توليد الصوت</button>
</div>

<div class="divider">او</div>

<div class="box">
<div class="label">عندك صوت وتريد تعدله؟</div>
<button class="btn btn-outline" onclick="goToEditor()">🎵 فتح محر الصوت</button>
</div>

<div class="box">
<div class="label">عندك فيديو وتريد تعدله؟</div>
<button class="btn btn-video" onclick="goToVideo()">🎬 فتح محر الفيديو</button>
</div>

<button class="btn back" onclick="location.href='index.html'">⬅️ الرجوع للرئيسية</button>
</div>

<script>
function makeAI(){
  const prompt = document.getElementById('aiPrompt').value;
  if(prompt.trim() == ''){alert('اكتب وصف الصوت اول'); return;}

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 5, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let freq = 180;
  if(prompt.includes('غاضب')) freq = 120;
  if(prompt.includes('ملكي')) freq = 100;
  if(prompt.includes('طفل')) freq = 600;
  if(prompt.includes('شيطان')) freq = 80;
  for(let i=0; i<buffer.length; i++){
    data[i] = Math.sin(2*Math.PI*freq*i/ctx.sampleRate) * 0.3 * Math.sin(Math.PI*i/buffer.length);
  }

  const wav = toWav(buffer);
  const url = URL.createObjectURL(new Blob([wav], {type:'audio/wav'}));

  localStorage.setItem('audioData', url);
  localStorage.setItem('audioName', prompt);

  alert('تم توليد الصوت الشيطاني! سيتم نقلك للمحر الان');
  window.location.href = 'audio-editor.html';
}

function goToEditor(){
  window.location.href = 'audio-editor.html';
}

function goToVideo(){
  window.location.href = 'video-editor.html';
}

function toWav(buffer){
  const len = buffer.length * 2 + 44;
  const buf = new ArrayBuffer(len);
  const v = new DataView(buf);
  let p = 0;
  const s16 = d => {v.setInt16(p,d,true);p+=2};
  const s32 = d => {v.setInt32(p,d,true);p+=4};
  s32(0x46464952);s32(len-8);s32(0x45564157);s32(0x20746d66);s32(16);s16(1);s16(1);
  s32(buffer.sampleRate);s32(buffer.sampleRate*2);s16(2);s16(16);s32(0x61746164);s32(len-p-4);
  const d = buffer.getChannelData(0);
  for(let i=0;i<d.length;i++){let s=Math.max(-1,Math.min(1,d[i]));v.setInt16(p,s<0?s*0x8000:s*0x7FFF,true);p+=2;}
  return v;
}
</script>
</body>
</html>
