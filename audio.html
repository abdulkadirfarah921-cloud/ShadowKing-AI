<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOWKING TITAN VOID</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Arial}
body{
  background:#000;
  color:#FFD700;
  text-align:center;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* خلفية ماتركس + نار */
.matrix-rain{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:-2;
  opacity:0.2;
}
.fire-bg{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:
    radial-gradient(circle at 20% 30%, #ff000033 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, #ff000033 0%, transparent 50%);
  animation:fire 4s infinite alternate;
  z-index:-1;
}
@keyframes fire{0%{opacity:0.2} 100%{opacity:0.6}}

.container{
  max-width:1400px;
  margin:40px auto;
  padding:20px;
  position:relative;
  z-index:1;
}

h1{
  font-size:42px;
  font-weight:900;
  text-shadow:0 0 20px #FFD700;
  margin-bottom:10px;
}

/* زر النار */
.fab-btn{
  position:fixed;
  bottom:30px;
  right:30px;
  background:radial-gradient(circle, #FFD700, #ff5500);
  width:70px;
  height:70px;
  border-radius:50%;
  border:none;
  font-size:35px;
  cursor:pointer;
  box-shadow:0 0 30px #FFD700;
  z-index:999;
  transition:0.3s;
}
.fab-btn:hover{transform:scale(1.1) rotate(180deg)}

/* قائمة المودات */
.modes-menu{
  display:none;
  position:fixed;
  bottom:110px;
  right:30px;
  background:#0a0a0a;
  border:2px solid #FFD700;
  border-radius:20px;
  padding:15px;
  width:280px;
  box-shadow:0 0 40px #FFD70050;
  z-index:999;
}
.modes-menu.show{display:block}
.mode-item{
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  cursor:pointer;
  font-weight:700;
  text-align:right;
}
.mode-item:hover{background:#FFD700; color:#000}

</style>
</head>
<body>

<!-- الخلفيات -->
<canvas class="matrix-rain" id="matrix"></canvas>
<div class="fire-bg"></div>

<div class="container">
  <h1>SHADOWKING TITAN VOID</h1>
  <p>دوس زر النار تحت واختار المصنع</p>
</div>

<!-- زر النار + القائمة -->
<button class="fab-btn" onclick="toggleModes()">🔥</button>
<div class="modes-menu" id="modesMenu">
  <div class="mode-item" onclick="location.href='app.html'">📱 مصنع التطبيقات</div>
  <div class="mode-item" onclick="location.href='site.html'">🌐 مصنع المواقع</div>
  <div class="mode-item" onclick="location.href='image.html'">🖼️ مصنع الصور</div>
  <div class="mode-item" onclick="location.href='audio.html'">🎵 مصنع الاصوات</div>
  <div class="mode-item" onclick="location.href='video-editor.html'">🎬 مصنع الفيديو</div>
</div>

<script>
// تفعيل الماتركس
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let chars = "01SHADOWKING".split("");
let font_size = 14;
let columns = canvas.width/font_size;
let drops = [];
for(let x = 0; x < columns; x++) drops[x] = 1;
function draw(){
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0F0";
  ctx.font = font_size + "px arial";
  for(let i = 0; i < drops.length; i++){
    let text = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(text, i*font_size, drops[i]*font_size);
    if(drops[i]*font_size > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(draw, 35);

function toggleModes(){
  document.getElementById('modesMenu').classList.toggle('show');
}
</script>

</body>
</html>
